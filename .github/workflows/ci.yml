name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: engineering_notes_ci
          POSTGRES_USER: engineering_notes_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engineering_notes_ci -d engineering_notes_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://engineering_notes_ci:ci-only-password@127.0.0.1:5432/engineering_notes_ci
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
      API_BASE_URL: http://127.0.0.1:8765/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - run: python -m pip install --require-hashes -r requirements-dev.lock
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
      - run: python -m ruff check app tests
        working-directory: backend
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python tests/run_full_stack_smoke.py
        working-directory: backend

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_DB: engineering_notes
      POSTGRES_USER: engineering_notes
      POSTGRES_PASSWORD: ci-only-database-password
      APP_SECRET_KEY: ci-only-application-secret-at-least-32-bytes
      PUBLIC_ORIGIN: https://devlelin.xyz
      API_CORS_ORIGINS: '["https://devlelin.xyz"]'
      API_ALLOWED_HOSTS: '["devlelin.xyz","api","127.0.0.1","localhost"]'
      PUBLIC_CONTACT_EMAIL: admin@lelin.dev
      INITIAL_ADMIN_EMAIL: admin@lelin.dev
      INITIAL_ADMIN_PASSWORD: ci-only-initial-password
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.prod.yml config --quiet
      - run: docker compose -f deploy/compose.prod.yml build api web
      - name: Start containers and verify health
        run: |
          trap 'docker compose -f deploy/compose.prod.yml down' EXIT
          docker compose -f deploy/compose.prod.yml up -d --wait --wait-timeout 180 postgres api web
          docker compose -f deploy/compose.prod.yml ps
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8000/api/v1/health
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:3000/
