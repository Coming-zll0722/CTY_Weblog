name: Release

on:
  push:
    tags:
      - "release-*"

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  packages: write

env:
  API_IMAGE: ghcr.io/coming-zll0722/cty-weblog-api
  WEB_IMAGE: ghcr.io/coming-zll0722/cty-weblog-web

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require a green commit from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          checks="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=latest&per_page=100"
          )"
          for required_check in frontend backend containers; do
            conclusion="$(
              jq -r --arg name "$required_check" \
                '[.check_runs[] | select(.name == $name)] | sort_by(.completed_at) | last | .conclusion // ""' \
                <<< "$checks"
            )"
            if [[ "$conclusion" != "success" ]]; then
              echo "Required check did not pass: $required_check ($conclusion)" >&2
              exit 1
            fi
          done

  build-api:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build and publish API
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: backend
          file: deploy/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-api
          cache-to: type=gha,mode=max,scope=release-api

  build-web:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build and publish web
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-web
          cache-to: type=gha,mode=max,scope=release-web

  bundle:
    needs: [build-api, build-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create the verified relay bundle
        env:
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
          WEB_DIGEST: ${{ needs.build-web.outputs.digest }}
        run: |
          set -Eeuo pipefail
          api_ref="${API_IMAGE}@${API_DIGEST}"
          web_ref="${WEB_IMAGE}@${WEB_DIGEST}"
          docker pull "$api_ref"
          docker pull "$web_ref"
          docker tag "$api_ref" "cty-log-api:$GITHUB_REF_NAME"
          docker tag "$web_ref" "cty-log-web:$GITHUB_REF_NAME"
          install -d bundle
          docker image save \
              "cty-log-api:$GITHUB_REF_NAME" \
              "cty-log-web:$GITHUB_REF_NAME" \
            | gzip -6 > bundle/images.tar.gz
          {
            printf 'RELEASE_ID=%s\n' "$GITHUB_REF_NAME"
            printf 'API_DIGEST=%s\n' "$API_DIGEST"
            printf 'WEB_DIGEST=%s\n' "$WEB_DIGEST"
            printf 'GIT_REVISION=%s\n' "$GITHUB_SHA"
          } > bundle/release.env
          (
            cd bundle
            sha256sum images.tar.gz > images.tar.gz.sha256
          )
      - name: Publish the verified relay bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          gh release create "$GITHUB_REF_NAME" \
            bundle/images.tar.gz \
            bundle/images.tar.gz.sha256 \
            bundle/release.env \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Immutable CTY Log production images and verified relay metadata."
      - name: Upload the verified relay bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cty-log-${{ github.ref_name }}
          path: bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  deploy:
    needs: [build-api, build-web, bundle]
    if: ${{ vars.DEPLOY_TRANSPORT == 'direct' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare the restricted SSH identity
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/cty-log-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/cty-log-deploy" "$HOME/.ssh/known_hosts"
      - name: Transfer verified images
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
          WEB_DIGEST: ${{ needs.build-web.outputs.digest }}
        run: |
          set -Eeuo pipefail
          api_ref="${API_IMAGE}@${API_DIGEST}"
          web_ref="${WEB_IMAGE}@${WEB_DIGEST}"
          docker pull "$api_ref"
          docker pull "$web_ref"
          docker tag "$api_ref" "cty-log-api:$GITHUB_REF_NAME"
          docker tag "$web_ref" "cty-log-web:$GITHUB_REF_NAME"
          docker image save \
              "cty-log-api:$GITHUB_REF_NAME" \
              "cty-log-web:$GITHUB_REF_NAME" \
            | gzip -1 \
            | ssh \
                -i "$HOME/.ssh/cty-log-deploy" \
                -p "$DEPLOY_PORT" \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o PasswordAuthentication=no \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=20 \
                "$DEPLOY_USER@$DEPLOY_HOST" \
                "load $GITHUB_REF_NAME $API_DIGEST $WEB_DIGEST $GITHUB_SHA"
      - name: Deploy transferred images
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
          WEB_DIGEST: ${{ needs.build-web.outputs.digest }}
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/cty-log-deploy" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $GITHUB_REF_NAME $API_DIGEST $WEB_DIGEST $GITHUB_SHA"
