# Keep the original Compose project name so the production database, uploads,
# and backup volumes survive the CTY Log repository/path rename.
name: engineering-notes

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-security: &app-security
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s

services:
  nginx:
    image: nginx:1.27-alpine
    profiles: ["container-nginx"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - --no-check-certificate
        - "--header=Host: devlelin.xyz"
        - https://127.0.0.1/api/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend
    logging: *json-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 100

  web:
    <<: *app-security
    image: ${WEB_IMAGE:-engineering-notes-web:${IMAGE_TAG:-current}}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      API_BASE_URL: http://api:8000/api/v1
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      SITE_URL: ${PUBLIC_ORIGIN}
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    logging: *json-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
          pids: 200

  api:
    <<: *app-security
    image: ${API_IMAGE:-engineering-notes-api:${IMAGE_TAG:-current}}
    build:
      context: ../backend
      dockerfile: ../deploy/api.Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${APP_SECRET_KEY}
      CORS_ORIGINS: ${API_CORS_ORIGINS}
      ALLOWED_HOSTS: ${API_ALLOWED_HOSTS}
      PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:-}
      PUBLIC_GITHUB_URL: ${PUBLIC_GITHUB_URL:-}
      UPLOAD_ROOT: /data/uploads
      BACKUP_ROOT: /data/backups
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend
    logging: *json-logging
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
          pids: 200

  migrate:
    <<: *app-security
    image: ${API_IMAGE:-engineering-notes-api:${IMAGE_TAG:-current}}
    build:
      context: ../backend
      dockerfile: ../deploy/api.Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${APP_SECRET_KEY}
      CORS_ORIGINS: ${API_CORS_ORIGINS}
      ALLOWED_HOSTS: ${API_ALLOWED_HOSTS}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    logging: *json-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
          pids: 100

  init-admin:
    <<: *app-security
    image: ${API_IMAGE:-engineering-notes-api:${IMAGE_TAG:-current}}
    profiles: ["tools"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${APP_SECRET_KEY}
      CORS_ORIGINS: ${API_CORS_ORIGINS}
      ALLOWED_HOSTS: ${API_ALLOWED_HOSTS}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      INITIAL_ADMIN_ROLE: ${INITIAL_ADMIN_ROLE:-super_admin}
    command: ["python", "-m", "app.cli", "create-admin"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    logging: *json-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
          pids: 100

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    logging: *json-logging
    stop_grace_period: 1m
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
          pids: 200

networks:
  frontend:
    internal: false
  backend:
    internal: true

volumes:
  postgres_data:
    name: engineering-notes_postgres_data
  uploads:
    name: engineering-notes_uploads
  backups:
    name: engineering-notes_backups
